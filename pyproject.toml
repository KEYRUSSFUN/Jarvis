[project]
name = "jarvis"
version = "0.1.0"
description = "Локальный голосовой ассистент для Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "comtypes>=1.4",
    "faster-whisper>=1.1",
    "num2words>=0.5.13",
    "numpy>=1.26",
    "ollama>=0.5",
    "psutil>=6.0",
    "pycaw>=20240210",
    "pynput>=1.7.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "sounddevice>=0.5",
    "torch>=2.4",
]

[project.optional-dependencies]
# CUDA-библиотеки для faster-whisper на видеокарте (без них распознавание идёт на CPU)
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
jarvis = "jarvis.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

# Silero TTS работает на CPU, CUDA-сборка torch (~2.5 ГБ) не нужна
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: прогон набора команд через настоящую модель в Ollama (медленно, нужен запущенный Ollama)",
]
addopts = "-m 'not llm'"
