# Диалоги для проверки памяти: uv run pytest -m llm
# Команды идут по очереди через настоящего агента (инструменты не выполняются, а отвечают «выполнено»).
# Проверяется последняя команда: какой инструмент модель вызвала первым (expect, как в commands.yaml)
# или что прозвучало в ответе (says).

- dialog: ["Открой блокнот", "Закрой его"]
  expect: {tool: close_app, args: {app: Блокнот}}
- dialog: ["Открой телеграм", "Нет, лучше дискорд"]
  expect: {tool: open_app, args: {app: Discord}}
- dialog: ["Сделай громкость 30", "Ещё тише"]
  expect: {tool: change_volume, args: {delta: "<0"}}
- dialog: ["Найди рецепт блинов", "А теперь оладий"]
  expect: {tool: web_search, args: {query: оладьи}}
- dialog: ["Как загружен процессор?", "А память?"]
  expect: {tool: system_info}
- dialog: ["Открой ютуб", "Теперь гитхаб"]
  expect: {tool: open_url, args: {url: github.com}}
- dialog: ["Меня зовут Кирилл", "Как меня зовут?"]
  says: Кирилл
- dialog: ["Запомни число сорок два", "Какое число я просил запомнить?"]
  says: сорок два
- dialog: ["Открой отчёт", "Напиши в нём: совещание в пятницу"]
  expect: {tool: type_text, args: {text: совещание в пятницу, window: отчёт}}
- dialog: ["Открой блокнот", "Напиши список покупок: хлеб, молоко", "Сохрани"]
  expect: {tool: press_keys, args: {keys: ctrl+s}}
