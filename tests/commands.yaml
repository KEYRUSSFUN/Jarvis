# Громкость
- say: Сделай громкость 50%.
  expect: {tool: set_volume, args: {percent: 50}}
- say: Громкость на тридцать
  expect: {tool: set_volume, args: {percent: 30}}
- say: Громкость 75
  expect: {tool: set_volume, args: {percent: 75}}
- say: Поставь громкость на максимум.
  expect: {tool: set_volume, args: {percent: 100}}
- say: Сделай погромче.
  expect: {tool: change_volume, args: {delta: ">0"}}
- say: Потише
  expect: {tool: change_volume, args: {delta: "<0"}}
- say: Сделай тише на 20 процентов.
  expect: {tool: change_volume, args: {delta: -20}}
- say: Выключи звук.
  expect: {tool: mute}
- say: Включи звук обратно
  expect: {tool: unmute}

